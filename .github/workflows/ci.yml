name: CI

on:
  push:
    branches: [ "main", "wipdayz" ]
  pull_request:
    branches: [ "main", "wipdayz" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run Typecheck
      run: npm run typecheck
      
    - name: Run Vitest
      run: npm run test
